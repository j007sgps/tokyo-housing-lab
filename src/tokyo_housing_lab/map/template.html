<title>東京中古マンション地図</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Shippori+Mincho+B1:wght@600&display=swap">
<style>
  /* 版面：上方控制列 → 地圖（左）＋詳細面板（右，窄螢幕時移到下方）→ 路線圖 → 排行 → 說明 */
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --fg: #16202b;
    --muted: #586473;
    --line: #d6dce3;
    --accent: #1f5f8b;
    --accent-ink: #ffffff;
    --na: #c7cdd4;
    --ward: #e4e9ee;
    --hatch: rgba(22, 32, 43, 0.55);
    --boundary: #ffffff;
    --warn: #a3620a;
    --hed: #7a3ea8;
    --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-body: "Noto Sans TC", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141a; --panel: #18202a; --fg: #e5eaf0; --muted: #98a4b1; --line: #2a3542;
      --accent: #7db3e3; --accent-ink: #0f141a; --na: #39434e; --ward: #212b36; --hatch: rgba(229, 234, 240, 0.6); --boundary: #0f141a; --warn: #e3a64a; --hed: #c79be6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141a; --panel: #18202a; --fg: #e5eaf0; --muted: #98a4b1; --line: #2a3542;
    --accent: #7db3e3; --accent-ink: #0f141a; --na: #39434e; --ward: #212b36; --hatch: rgba(229, 234, 240, 0.6); --boundary: #0f141a; --warn: #e3a64a; --hed: #c79be6;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
  [hidden] { display: none !important; }
  .tm { max-width: 1240px; margin-inline: auto; padding-block: 20px 40px;
        padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
        display: flex; flex-direction: column; gap: 16px; }
  .tm-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; justify-content: space-between; }
  .tm-head-text { flex: 1 1 320px; min-width: 0; }
  .tm-lang button { font-size: .82rem; padding: 4px 11px; }
  .tm-head h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: .04em; text-wrap: balance; }
  .tm-head p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .tm-controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; }
  .tm-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .tm-label { font-size: .75rem; color: var(--muted); letter-spacing: .06em; }
  .tm-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 3px; }
  .tm-seg button { border: 0; background: transparent; color: var(--fg); font: inherit; font-size: .9rem; padding: 5px 14px; border-radius: 999px; cursor: pointer; }
  .tm-seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .tm-seg button:disabled { color: var(--muted); cursor: not-allowed; opacity: .55; }
  .tm-seg button:focus-visible, .tm select:focus-visible, .tm-rank button:focus-visible, .tm-zoom button:focus-visible, .tm-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tm select { font: inherit; font-size: .9rem; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 100%; }
  .tm-years { display: flex; align-items: center; gap: 6px; }
  .tm-explain { margin: 0; color: var(--muted); font-size: .88rem; max-width: 76ch; }
  .tm-main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .tm-main { grid-template-columns: minmax(0, 1fr); } }
  .tm-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
  .tm-card > h3 { margin: 0 0 8px; font-size: .95rem; font-weight: 500; }
  .tm-map { position: relative; }
  .tm-map svg { display: block; width: 100%; height: auto; touch-action: pan-x pan-y; }
  .tm-map path.area { stroke: var(--boundary); stroke-width: .8; cursor: pointer; vector-effect: non-scaling-stroke; }
  .tm-map path.area:hover { stroke: var(--fg); stroke-width: 1.4; }
  .tm-map path.ward { cursor: default; }
  .tm-map path.ward:hover { stroke: var(--boundary); stroke-width: .8; }
  .tm-map circle.st { stroke: var(--panel); stroke-width: .8; cursor: pointer; vector-effect: non-scaling-stroke; }
  .tm-map circle.st:hover { stroke: var(--fg); stroke-width: 1.6; }
  .tm-map image.depth { pointer-events: none; }
  .tm-map path.school-hit { fill: transparent; fill-rule: evenodd; cursor: pointer; }
  .tm-map path.school-hit:hover { fill: color-mix(in srgb, var(--accent) 22%, transparent); }
  .tm-map path.school-line { fill: none; stroke: var(--fg); stroke-opacity: .6; stroke-width: .7; vector-effect: non-scaling-stroke; pointer-events: none; }
  .tm-map .route { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: .7; }
  .tm-zoom { position: absolute; top: 20px; right: 20px; display: flex; gap: 4px; z-index: 2; }
  .tm-zoom button { font: inherit; font-size: .8rem; min-width: 30px; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px;
                    background: var(--panel); color: var(--fg); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .tm-tip { position: absolute; pointer-events: none; z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 6px 10px; font-size: .82rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tm-tip b { display: block; font-weight: 500; }
  .tm-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 8px; font-size: .78rem; color: var(--muted); }
  .tm-map .tm-legend svg { display: block; width: 240px; max-width: 100%; height: auto; }
  .tm-legend text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
  .tm-key { display: inline-flex; align-items: center; gap: 6px; }
  .tm-swatch { width: 18px; height: 12px; border-radius: 2px; border: 1px solid var(--line); }
  .tm-swatch.round { width: 12px; border-radius: 50%; }
  .tm-panel h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; }
  .tm-panel h3 { margin: 14px 0 4px; font-size: .85rem; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
  .tm-big { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tm-big small { font-size: .9rem; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .tm-sub { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .tm-badge { display: inline-block; font-size: .72rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; vertical-align: middle; }
  .tm-badge.warn { border-color: var(--muted); }
  .tm-note { margin: 10px 0 0; font-size: .82rem; color: var(--muted); }
  .tm-warn { margin: 10px 0 0; font-size: .82rem; padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--warn);
             background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .tm-warn b { color: var(--warn); font-weight: 500; }
  .tm-cmp { margin: 10px 0 0; font-size: .88rem; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 9%, transparent); font-variant-numeric: tabular-nums; }
  .tm-cmp b { font-weight: 500; }
  .tm-link { font: inherit; font-size: .85rem; color: var(--accent); background: none; border: 0; padding: 0; margin-top: 8px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .tm-kv { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
  .tm-kv th, .tm-kv td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  .tm-kv th:first-child, .tm-kv td:first-child { text-align: left; }
  .tm-kv th { font-weight: 500; color: var(--muted); font-size: .75rem; }
  .tm-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tm-chart text, .tm-linechart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
  .tm-linechart { overflow-x: auto; }
  .tm-linechart svg { display: block; }
  .tm-linechart .pt { cursor: pointer; }
  .tm-linechart text.name { fill: var(--fg); cursor: pointer; }
  .tm-linechart text.name.dim { fill: var(--muted); }
  .tm-linechart text.name.sel { font-weight: 700; }
  .tm-rank { max-height: 26rem; overflow: auto; }
  .tm-rank table { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
  .tm-rank th { position: sticky; top: 0; background: var(--panel); text-align: right; font-weight: 500; color: var(--muted); font-size: .75rem; padding: 6px; border-bottom: 1px solid var(--line); }
  .tm-rank td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  .tm-rank th:nth-child(2), .tm-rank td:nth-child(2) { text-align: left; }
  .tm-rank td small { color: var(--muted); margin-left: 6px; font-size: .75rem; }
  .tm-rank button { font: inherit; color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .tm-rank tr.selected td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .tm-rank tr.dim td { color: var(--muted); }
  .tm-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .tm-est-form { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
  .tm-est-form input[type="number"] { font: inherit; font-size: .9rem; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
                                     border-radius: 8px; padding: 5px 8px; width: 6.5em; }
  .tm-est-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tm-check { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; padding-bottom: 6px; cursor: pointer; }
  .tm-est-result { margin-top: 12px; }
  .tm-est-result td { vertical-align: top; }
  .tm-est-result td b { font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
  .tm-est-result td small { display: block; color: var(--muted); font-size: .78rem; white-space: nowrap; }
  .tm-est-result td:first-child { white-space: nowrap; }
  @media (max-width: 600px) {
    .tm-est-result .tm-kv th, .tm-est-result .tm-kv td { padding: 4px 3px; }
    .tm-est-result td b { font-size: .88rem; }
    .tm-est-result td small { font-size: .7rem; }
  }
  .tm-notes { color: var(--muted); font-size: .8rem; display: flex; flex-direction: column; gap: 6px; }
  .tm-notes p { margin: 0; max-width: 90ch; }
  .tm-notes strong { color: var(--fg); font-weight: 500; }
  .tm-notes h3 { margin: 0; font-size: .95rem; font-weight: 500; color: var(--fg); }
  .tm-notes details { border-top: 1px solid var(--line); padding: 6px 0 2px; max-width: 90ch; }
  .tm-notes details:last-of-type { border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .tm-notes summary { cursor: pointer; color: var(--fg); font-weight: 500; font-size: .85rem; padding: 2px 0; }
  .tm-notes summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tm-notes details p { margin: 4px 0 6px; line-height: 1.7; }
  .tm-notes .tm-advice { color: var(--fg); margin-top: 6px; }
  @media (prefers-reduced-motion: no-preference) {
    .tm-map path.area { transition: fill .35s ease; }
  }
</style>

<div class="tm">
  <header class="tm-head">
    <div class="tm-head-text">
      <h1 data-i18n="title">東京中古マンション地図</h1>
      <p id="tm-source">—</p>
    </div>
    <div class="tm-seg tm-lang" role="group" aria-label="Language">
      <button type="button" data-lang="zh" lang="zh-Hant" aria-pressed="false">中文</button>
      <button type="button" data-lang="mix" lang="zh-Hant" aria-pressed="true">中文＋日文用語</button>
      <button type="button" data-lang="ja" lang="ja" aria-pressed="false">日本語</button>
    </div>
  </header>

  <section class="tm-controls" data-i18n-aria="controls.aria">
    <div class="tm-field" id="view-field">
      <span class="tm-label" data-i18n="view.label">顯示</span>
      <div class="tm-seg" role="group" data-i18n-aria="view.label">
        <button type="button" id="view-city" data-view="city" aria-pressed="true" data-i18n="view.city">行政區</button>
        <button type="button" id="view-station" data-view="station" aria-pressed="false" data-i18n="view.station">車站</button>
        <button type="button" id="view-line" data-view="line" aria-pressed="false" data-i18n="view.line">路線</button>
      </div>
    </div>
    <div class="tm-field" id="layer-field" hidden>
      <label class="tm-label" for="layer-select" data-i18n="layer.label">圖層</label>
      <select id="layer-select">
        <option value="" data-i18n="layer.none">無</option>
        <option value="flood" data-i18n="layer.flood">洪水（想定最大規模）</option>
        <option value="surge" data-i18n="layer.surge">高潮</option>
        <option value="elementary" data-i18n="layer.elementary">小學校區</option>
        <option value="junior" data-i18n="layer.junior">中學校區</option>
      </select>
    </div>
    <div class="tm-field">
      <span class="tm-label" data-i18n="mode.label">模式</span>
      <div class="tm-seg" role="group" data-i18n-aria="mode.label">
        <button type="button" id="mode-trend" data-mode="trend" aria-pressed="true" data-i18n="mode.trend">趨勢</button>
        <button type="button" id="mode-buy" data-mode="buy" aria-pressed="false" data-i18n="mode.buy">購買</button>

        <button type="button" id="pc-combined" data-pc="combined" aria-pressed="false" data-i18n="pc.combined">綜合</button>
        <button type="button" id="pc-01" data-pc="01" aria-pressed="false" data-i18n="pc.01">取引價格</button>
        <button type="button" id="pc-02" data-pc="02" aria-pressed="false" data-i18n="pc.02">成約價格</button>
      </div>
    </div>
    <div class="tm-field" id="line-field" hidden>
      <label class="tm-label" for="line-select" data-i18n="line.label">路線</label>
      <select id="line-select"></select>
    </div>
    <div class="tm-field" id="years-field">
      <span class="tm-label" data-i18n="years.label">比較期間</span>
      <div class="tm-years">
        <select id="year-start" data-i18n-aria="years.start"></select>
        <span aria-hidden="true">→</span>
        <select id="year-end" data-i18n-aria="years.end"></select>
      </div>
    </div>
  </section>
  <p class="tm-explain" id="tm-explain">—</p>

  <div class="tm-main">
    <section class="tm-card tm-map" data-i18n-aria="map.aria">
      <div class="tm-zoom" id="zoom" hidden>
        <button type="button" id="zoom-in" data-i18n-aria="zoom.in">＋</button>

      <div class="tm-legend" id="legend"></div>

    <p class="tm-advice" id="note-advice">—</p>
    <p id="note-disclaimer">—</p>
    <p id="note-credit">—</p>
  </footer>
</div>

<script id="map-data" type="application/json">/*__MAP_DATA__*/null</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(() => {
  const { data, boundaries } = JSON.parse(document.getElementById("map-data").textContent);
  const M = data.municipalities;
  const T = data.thresholds;
  const S = data.stations; // 車站資料（沒跑 fetch-stations 時是 null）
  const L = data.layers; // 淹水、學區（沒跑 fetch-hazards 時是 null）
  const E = data.estimate; // 估價的係數表
  const SL = S ? S.list : {};
  const lineByKey = S ? Object.fromEntries(S.lines.map((l) => [l.key, l])) : {};
  const DEFAULT_CITY = "13104"; // 一打開先選新宿区，面板就有內容
  const DEFAULT_LINE = "東日本旅客鉄道／中央線";
  const KU_MAX = "13123"; // 23 區的代碼是 13101〜13123
  const dataStations = Object.keys(SL).filter((id) => SL[id].latest);

  // ---- 語言：zh＝中文、mix＝中文＋日文用語、ja＝日本語（文字在 map/i18n.json）----
  const I18N = data.i18n;
  const LANGS = ["zh", "mix", "ja"];
  const LANG_KEY = "tokyo-housing-lab.lang";
  let lang = (() => {
    const q = new URLSearchParams(location.search).get("lang"); // ?lang= 優先（分享特定語言的網址）
    if (LANGS.includes(q)) return q;
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (LANGS.includes(saved)) return saved;
    } catch (e) { /* 私密視窗等：不能存就算了 */ }
    return (navigator.language || "").toLowerCase().startsWith("ja") ? "ja" : "mix";
  })();
  // 缺鍵：先退回 mix，mix 也沒有就顯示 ⟦鍵⟧（測試抓得到）
  const tx = (key, vars) => {
    const s = I18N[lang][key] ?? I18N.mix[key];
    if (s == null) return `⟦${key}⟧`;
    return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m)) : s;
  };
  // 名字（地名、站名、路線、校名）：zh 換成繁體字形（只換字，不意譯；假名照舊）
  const nm = (s) => (lang === "zh" && s ? [...s].map((c) => I18N.hant[c] || c).join("") : s);

  // ---- 狀態 ----
  const pts = data.priceTypes;
  const years01 = pts["01"].completeYears;
  const biggestIn = (ids) => ids.filter((id) => SL[id] && SL[id].latest).sort((a, b) => SL[b].total - SL[a].total)[0];
  const state = {
    view: "city", // city／station／line
    mode: "trend",
    pc: pts.hedonic ? "hedonic" : pts.combined ? "combined" : "01",
    start: years01[Math.max(0, years01.length - 11)],
    end: years01[years01.length - 1],
    selected: M[DEFAULT_CITY] ? DEFAULT_CITY : Object.keys(M)[0],
    line: S && S.lines.length ? (lineByKey[DEFAULT_LINE] ? DEFAULT_LINE : S.lines[0].key) : null,
    layer: "", // 疊在地圖上的圖層：""／flood／surge／elementary／junior
    station: S ? biggestIn(dataStations.filter((id) => SL[id].city === DEFAULT_CITY)) || biggestIn(dataStations) : null,
  };
  const stationView = () => state.view !== "city";
  // 比較期間：行政區和車站各記各的（車站的資料年份不同，預設期間也不同）
  const savedYears = { city: null, station: S && S.trendDefault };
  function setView(view) {
    const from = stationView() ? "station" : "city";
    state.view = view;
    const to = stationView() ? "station" : "city";
    if (from !== to) {
      savedYears[from] = [state.start, state.end];
      if (savedYears[to]) [state.start, state.end] = savedYears[to];
    }
    if (view === "line" && !lineByKey[state.line].ids.includes(state.station)) state.station = biggestIn(lineByKey[state.line].ids);
  }
  const zoomOf = { city: null, station: null, line: null }; // 各顯示方式的縮放（null = 預設範圍）
  const isDepth = () => state.layer === "flood" || state.layer === "surge";
  const isSchool = () => state.layer === "elementary" || state.layer === "junior";
  const layerLabel = (k) => tx(`layer.${k}`);

  // 學區的座標：1e-5 度的整數，第一點是絕對值、之後是差（build.py 的 encode_line）。只解一次
  const decodeLine = (a) => {
    const out = [];
    let x = 0, y = 0;
    for (let i = 0; i < a.length; i += 2) { x += a[i]; y += a[i + 1]; out.push([x / 1e5, y / 1e5]); }
    return out;
  };
  const schoolsOf = {};
  function schools(kind) {
    if (!schoolsOf[kind]) {
      schoolsOf[kind] = L.schools[kind].map((s) => ({
        ...s, lines: s.outlines.map(decodeLine), polys: s.polygons.map((poly) => poly.map(decodeLine)),
      }));
    }
    return schoolsOf[kind];
  }

  // ---- 格式 ----
  const man = (yen) => (yen / 10000).toFixed(1);
  const pct = (x) => (x > 0 ? "+" : x < 0 ? "−" : "±") + Math.abs(x * 100).toFixed(1) + "%";
  const fmtN = d3.format(",");
  const pcLabel = (pc) => tx(`pcLong.${pc}`);
  const nameOf = (code, fallback) => nm(M[code] ? M[code].name.replace(/^西多摩郡/, "") : fallback);
  const lineLabel = () => (state.line ? nm(lineByKey[state.line].label) : "");
  const standard = () => tx("standard", data.standard);

  // ---- 每個模式的值：{v, lo, hi, n, status} ----
  // src = {latest, growth, yearly, invest}：區（某價格種類）、車站、車站比較用的區，格式都一樣
  function valueFrom(src) {
    if (!src) return { status: "insufficient", n: 0 };
    if (state.mode === "buy") {
      const p = src.latest;
      if (!p) return { status: "insufficient", n: 0 };
      return { v: p.median, lo: p.low, hi: p.high, n: p.n, status: p.status };
    }
    if (state.mode === "trend") {
      const g = (src.growth || {})[`${state.start}-${state.end}`];
      const yearN = (y) => ((src.yearly || []).find((r) => r[0] === y) || [y, 0])[1];
      const n = `${fmtN(yearN(state.start))}／${fmtN(yearN(state.end))}`;
      if (!g) return { status: "insufficient", n };
      return { v: g[0], lo: g[1], hi: g[2], n, status: g[3] ? "uncertain" : "ok" };
    }
    const t = src.invest;
    if (!t || t.status === "insufficient") return { status: "insufficient", n: tx("years.n", { n: t ? t.years : 0 }) };
    return { v: t.annual, lo: t.low, hi: t.high, n: tx("years.n", { n: t.years }), status: t.status };
  }
  const citySrc = (code) => M[code] && {
    latest: M[code].latest[state.pc], growth: M[code].growth[state.pc], yearly: M[code].yearly[state.pc], invest: M[code].invest[state.pc],
  };
  const sameMethodCity = (code) => S && S.cityLatest[code] && {
    latest: S.cityLatest[code], growth: S.cityGrowth[code], yearly: S.cityYearly[code], invest: S.cityInvest[code],
  };
  const valueOf = (code) => valueFrom(citySrc(code));
  const valueOfStation = (id) => valueFrom(SL[id] && SL[id].latest ? SL[id] : null);
  const fmtValue = (v) => (state.mode === "buy" ? tx("fmt.man", { v: man(v) }) : state.mode === "trend" ? pct(v) : tx("fmt.perYear", { v: pct(v) }));
  const fmtRange = (lo, hi) => (state.mode === "buy" ? `${man(lo)}〜${man(hi)}` : `${pct(lo)}〜${pct(hi)}`);

  // 目前顯示方式的所有項目（地圖上色、排行用）
  function items() {
    if (state.view === "city") return Object.keys(M).map((code) => ({ key: code, ...valueOf(code) }));
    const ids = state.view === "line" ? lineByKey[state.line].ids : dataStations;
    return ids.map((id) => ({ key: id, ...valueOfStation(id) }));
  }

  // ---- 顏色 ----
  // 車站：色階用全部車站的值（換路線時顏色的意思不變）
  function colorScale() {
    const src = state.view === "city" ? Object.keys(M).map(valueOf) : dataStations.map(valueOfStation);
    const vals = src.filter((x) => x.status !== "insufficient").map((x) => x.v);
    if (!vals.length) return () => "var(--na)";
    if (state.mode === "buy") {
      // 色階最淺的一段接近白色，會被看成「沒資料」，所以從 18% 開始
      const s = d3.scaleSequentialLog(d3.extent(vals), (t) => d3.interpolatePuBu(0.18 + 0.82 * t));
      s.kind = "seq";
      return s;
    }
    // 車站的漲幅有少數極端值：色階到 98 百分位就飽和，不然大部分車站都很淡
    const abs = vals.map(Math.abs).sort(d3.ascending);
    const max = (state.view === "city" ? d3.max(abs) : d3.quantile(abs, 0.98)) || 0.01;
    const s = d3.scaleDiverging([-max, 0, max], (t) => d3.interpolateRdBu(1 - t)).clamp(true);
    s.kind = "div";
    return s;
  }

  // ---- 地圖 ----
  // d3 的球面幾何要求外環順時針；GeoJSON（RFC 7946）是逆時針，面積會變成「整個地球減掉這塊」，要反過來
  for (const f of boundaries.features) {
    if (d3.geoArea(f) > 2 * Math.PI) {
      const g = f.geometry;
      const polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
      for (const poly of polys) for (const ring of poly) ring.reverse();
    }
  }
  const mapEl = document.getElementById("map");
  const tip = document.createElement("div");
  tip.className = "tm-tip";
  tip.hidden = true;
  mapEl.parentElement.append(tip);
  let zoomApi = null; // drawMap 時設定：{in, out, ku, all}

  function showTip(ev, title, text) {
    tip.replaceChildren();
    const b = document.createElement("b");
    b.textContent = title;
    tip.append(b, document.createTextNode(text));
    tip.hidden = false;
    const [px, py] = d3.pointer(ev, mapEl.parentElement);
    const maxX = mapEl.parentElement.clientWidth - tip.offsetWidth - 4;
    tip.style.left = `${Math.max(4, Math.min(maxX, px + 14))}px`;
    tip.style.top = `${Math.max(4, py - 40)}px`;
  }
  const tipText = (x) => (x.status === "insufficient" ? tx("insufficient") : fmtValue(x.v) + (x.status === "uncertain" ? tx("tip.uncertain") : ""));

  // 圖層：淹水是 PNG（Mercator 的格網，地圖也是 Mercator，四個角對上就整張對齊）；學區是邊界線＋滑鼠用的透明面
  function drawLayer(g, proj, onClick, tipExtra) {
    if (!L || !state.layer) return;
    if (isDepth()) {
      const [west, south, east, north] = L.bounds;
      const [x0, y0] = proj([west, north]), [x1, y1] = proj([east, south]);
      g.append("image").attr("class", "depth").attr("href", L.images[state.layer]).attr("preserveAspectRatio", "none")
        .attr("x", x0).attr("y", y0).attr("width", x1 - x0).attr("height", y1 - y0)
        .attr("opacity", stationView() ? 0.55 : 1); // 車站的圓也是暖色：淹水調淡一點才分得出來
      return;
    }
    const pathOf = (rings, close) => rings.map((r) => "M" + r.map((p) => proj(p).map((v) => v.toFixed(1)).join(",")).join("L") + (close ? "Z" : "")).join("");
    const list = schools(state.layer);
    const lg = g.append("g");
    lg.selectAll("path.school-hit").data(list.flatMap((s) => s.polys.map((rings) => ({ s, rings })))).join("path")
      .attr("class", "school-hit").attr("d", (d) => pathOf(d.rings, true))
      .on("pointermove", (ev, d) => showTip(ev, nm(d.s.name), tipExtra(d.s)))
      .on("pointerleave", () => { tip.hidden = true; })
      .on("click", (ev, d) => { if (onClick) onClick(d.s); });
    lg.append("path").attr("class", "school-line").attr("d", list.map((s) => pathOf(s.lines, false)).join(""));
  }

  function drawMap() {
    const w = mapEl.clientWidth || 600;
    const h = Math.round(w * (stationView() && w < 600 ? 0.9 : 0.56)); // 手機上車站很密，地圖高一點
    const proj = d3.geoMercator().fitExtent([[6, 6], [w - 6, h - 6]], boundaries);
    const path = d3.geoPath(proj);
    const color = colorScale();
    mapEl.replaceChildren();
    const svg = d3.select(mapEl).append("svg").attr("viewBox", `0 0 ${w} ${h}`).attr("role", "img")
      .attr("aria-label", stationView() ? tx("map.ariaStation") : tx("map.ariaCity"));
    const defs = svg.append("defs");
    defs.append("pattern").attr("id", "hatch").attr("width", 6).attr("height", 6)
      .attr("patternUnits", "userSpaceOnUse").attr("patternTransform", "rotate(45)")
      .append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 6)
      .style("stroke", "var(--hatch)").attr("stroke-width", 1.6);
    svg.append("rect").attr("width", w).attr("height", h).style("fill", "transparent"); // 空白處也能拖曳

    const g = svg.append("g");
    const feats = boundaries.features;
    let circles = null;
    if (!stationView()) {
      g.selectAll("path.area").data(feats).join("path")
        .attr("class", (f) => "area" + (f.properties.code === state.selected ? " selected" : ""))
        .attr("d", path)
        .style("fill", (f) => {
          if (isDepth()) return "var(--ward)"; // 淹水的顏色和價格的色階會混在一起：底色改成中性
          const x = valueOf(f.properties.code);
          return x.status === "insufficient" ? "var(--na)" : color(x.v);
        })
        .on("pointermove", (ev, f) => showTip(ev, nameOf(f.properties.code, f.properties.name), tipText(valueOf(f.properties.code))))
        .on("pointerleave", () => { tip.hidden = true; })
        .on("click", (ev, f) => select(f.properties.code));
      // 不確定（區間包含 0 或太寬）：上面再疊一層斜線
      g.selectAll("path.hatch").data(isDepth() ? [] : feats.filter((f) => valueOf(f.properties.code).status === "uncertain")).join("path")
        .attr("class", "hatch").attr("d", path).style("fill", "url(#hatch)").style("pointer-events", "none");
      drawLayer(g, proj, (s) => select(s.city), (s) => `${nameOf(s.city, s.city)}：${tipText(valueOf(s.city))}`);
      // 選取的區描邊畫在最上層
      const sel = feats.find((f) => f.properties.code === state.selected);
      if (sel) g.append("path").attr("d", path(sel)).style("fill", "none").style("stroke", "var(--fg)")
        .attr("stroke-width", 2.4).style("vector-effect", "non-scaling-stroke").style("pointer-events", "none");
    } else {
      g.selectAll("path.area").data(feats).join("path").attr("class", "area ward").attr("d", path).style("fill", "var(--ward)")
        .on("pointermove", (ev, f) => showTip(ev, nameOf(f.properties.code, f.properties.name), tx("tip.ward")))
        .on("pointerleave", () => { tip.hidden = true; });
      drawLayer(g, proj, null, (s) => nameOf(s.city, s.city));
      const ids = state.view === "line" ? lineByKey[state.line].ids : dataStations;
      const xy = (id) => proj([SL[id].lon, SL[id].lat]);
      if (state.view === "line") {
        g.append("path").attr("class", "route").attr("d", d3.line()(ids.map(xy)));
      }
      const maxTotal = d3.max(dataStations, (id) => SL[id].total) || 1;
      const maxR = Math.max(4, Math.min(9, w / 90)); // 圓的大小跟著地圖寬度，手機上才不會擠成一團
      const minR = Math.max(1.6, maxR * 0.3);
      const rScale = d3.scaleSqrt([0, maxTotal], [0, maxR]);
      const nodes = ids.map((id) => {
        const s = SL[id];
        const x = valueOfStation(id);
        const [cx, cy] = xy(id);
        return { id, s, x, cx, cy, r: s.latest ? Math.max(minR, rScale(s.total)) : minR * 0.8 };
      }).sort((a, b) => b.r - a.r); // 大的先畫，小的才不會被蓋住
      circles = g.append("g").selectAll("circle").data(nodes).join("circle").attr("class", "st")
        .attr("cx", (d) => d.cx).attr("cy", (d) => d.cy)
        .style("fill", (d) => (d.x.status === "insufficient" ? "var(--na)" : color(d.x.v)))
        .style("fill-opacity", (d) => (d.x.status === "uncertain" ? 0.45 : 1))
        .attr("stroke-dasharray", (d) => (d.x.status === "uncertain" ? "2 1.5" : null))
        .on("pointermove", (ev, d) => showTip(ev, nm(d.s.name), d.s.latest ? tipText(d.x) : tx("tip.noTrades")))
        .on("pointerleave", () => { tip.hidden = true; })
        .on("click", (ev, d) => selectStation(d.id));
      const sel = nodes.find((d) => d.id === state.station);
      if (sel) {
        const ring = g.append("circle").attr("cx", sel.cx).attr("cy", sel.cy).datum({ r: sel.r + 3 }).style("fill", "none")
          .style("stroke", "var(--fg)").attr("stroke-width", 2.2).style("vector-effect", "non-scaling-stroke").style("pointer-events", "none");
        circles = circles.merge(ring);
      }
    }

    // 縮放：拖曳移動；滑鼠要按 Ctrl（觸控板的雙指縮放也是），觸控要兩指（一指留給整頁捲動）
    const zoom = d3.zoom().scaleExtent([1, 16]).translateExtent([[0, 0], [w, h]])
      .filter((ev) => (ev.type === "wheel" ? ev.ctrlKey || ev.metaKey : ev.type.startsWith("touch") ? ev.touches.length >= 2 : !ev.button))
      .on("zoom", (ev) => {
        g.attr("transform", ev.transform);
        zoomOf[state.view] = ev.transform;
        if (circles) circles.attr("r", (d) => d.r / ev.transform.k);
      });
    svg.call(zoom).on("dblclick.zoom", null);
    const fit = (pointsXY) => {
      const [x0, x1] = d3.extent(pointsXY, (p) => p[0]), [y0, y1] = d3.extent(pointsXY, (p) => p[1]);
      const k = Math.max(1, Math.min(16, 0.9 / Math.max((x1 - x0) / w, (y1 - y0) / h, 1e-6)));
      return d3.zoomIdentity.translate(w / 2 - k * (x0 + x1) / 2, h / 2 - k * (y0 + y1) / 2).scale(k);
    };
    const kuBounds = () => feats.filter((f) => f.properties.code <= KU_MAX).flatMap((f) => path.bounds(f));
    const defaultT = () => {
      if (state.view === "city") return d3.zoomIdentity;
      if (state.view === "line") return fit(lineByKey[state.line].ids.map((id) => proj([SL[id].lon, SL[id].lat])));
      return fit(kuBounds());
    };
    svg.call(zoom.transform, zoomOf[state.view] || defaultT());
    zoomApi = {
      in: () => svg.transition().duration(250).call(zoom.scaleBy, 1.6),
      out: () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.6),
      ku: () => svg.transition().duration(400).call(zoom.transform, fit(kuBounds())),
      all: () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity),
    };
    drawLegend(color);
  }

  function drawLegend(color) {
    const el = document.getElementById("legend");
    el.replaceChildren();
    if (color.domain && !(isDepth() && !stationView())) {
      const w = 240, h = 34;
      const svg = d3.select(el).append("svg").attr("width", w).attr("height", h).attr("viewBox", `0 0 ${w} ${h}`);
      const id = "lg-grad";
      const grad = svg.append("defs").append("linearGradient").attr("id", id);
      const dom = color.domain();
      const lo = dom[0], hi = dom[dom.length - 1];
      const at = (t) => (color.kind === "seq" ? Math.exp(Math.log(lo) + t * (Math.log(hi) - Math.log(lo))) : lo + t * (hi - lo));
      d3.range(0, 1.0001, 0.1).forEach((t) => grad.append("stop").attr("offset", `${t * 100}%`).attr("stop-color", color(at(t))));
      svg.append("rect").attr("x", 4).attr("y", 2).attr("width", w - 8).attr("height", 10).attr("rx", 2).style("fill", `url(#${id})`);
      const ticks = color.kind === "seq" ? [lo, Math.sqrt(lo * hi), hi] : [lo, 0, hi];
      const more = color.kind === "div" && stationView() ? [tx("legend.below"), "", tx("legend.above")] : ["", "", ""];
      ticks.forEach((v, i) => svg.append("text").attr("x", 4 + (i / 2) * (w - 8)).attr("y", 28)
        .attr("text-anchor", i === 0 ? "start" : i === 2 ? "end" : "middle").text(fmtValue(v) + more[i]));
    }
    const key = (style, label, round) => {
      const k = document.createElement("span");
      k.className = "tm-key";
      const s = document.createElement("span");
      s.className = "tm-swatch" + (round ? " round" : "");
      Object.assign(s.style, style);
      k.append(s, document.createTextNode(label));
      el.append(k);
    };
    const text = (t) => el.append(Object.assign(document.createElement("span"), { textContent: t }));
    const hatch = { background: "repeating-linear-gradient(45deg, var(--hatch) 0 1.5px, transparent 1.5px 5px)" };
    if (L && isDepth()) {
      text(tx("legend.depth", { layer: layerLabel(state.layer) }));
      L.depthClasses.forEach((c, i) => key({ background: c.color }, tx(`depth.${i}`)));
      if (!stationView()) {
        text(tx("legend.depthCity"));
        return;
      }
    }
    if (L && isSchool()) text(tx("legend.school", { layer: layerLabel(state.layer) }));
    if (!stationView()) {
      key({ background: "var(--na)" }, tx("legend.naCity"));
      if (state.mode !== "buy") key(hatch, state.mode === "trend" ? tx("legend.flat") : tx("legend.uncertainWide"));
      return;
    }
    key({ background: "var(--na)" }, tx("insufficient"), true);
    if (state.mode !== "buy") key({ background: "var(--muted)", opacity: 0.45, borderStyle: "dashed" }, state.mode === "trend" ? tx("flat") : tx("uncertain"), true);
    text(tx("legend.station", { year: S.years[0] }));
  }

  // ---- 詳細面板 ----
  const panel = document.getElementById("panel");
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // 大字的數字＋區間；回傳 x
  function drawHeadline(x, modeLabel, note) {
    const head = el("div");
    head.append(el("div", "tm-sub", modeLabel));
    const big = el("div", "tm-big");
    if (x.status === "insufficient") {
      big.textContent = tx("insufficient");
    } else {
      big.textContent = state.mode === "buy" ? man(x.v) : pct(x.v);
      big.append(el("small", null, state.mode === "buy" ? tx("unit.manPerM2") : state.mode === "invest" ? tx("unit.perYear") : ""));
      if (x.status === "uncertain") big.append(el("span", "tm-badge warn", state.mode === "trend" ? tx("flat") : tx("uncertain")));
    }
    head.append(big);
    if (x.status !== "insufficient") head.append(el("div", "tm-sub", tx("head.ci", { range: fmtRange(x.lo, x.hi), n: x.n })));
    else head.append(el("div", "tm-sub", state.mode === "invest"
      ? tx("head.investShort", { minN: T.minN, minYears: T.investMinYears, n: x.n })
      : tx("head.short", { note, minN: T.minN, n: x.n })));
    panel.append(head);
  }

  // 淹水比例（區：面積中；車站：周邊半徑內）＋學區
  function drawHazard(h, where, schoolText) {
    if (!h) return;
    const [low, high] = L.thresholds;
    panel.append(el("h3", null, tx("hz.title", { where })));
    const kv = el("table", "tm-kv");
    const tr0 = el("tr");
    ["", tx("hz.over", { m: low }), tx("hz.over", { m: high })].forEach((t) => tr0.append(el("th", null, t)));
    kv.append(tr0);
    for (const k of ["flood", "surge"]) {
      const tr = el("tr");
      tr.append(el("td", null, layerLabel(k)), el("td", null, `${Math.round(h[k][0] * 100)}%`), el("td", null, `${Math.round(h[k][1] * 100)}%`));
      kv.append(tr);
    }
    panel.append(kv);
    panel.append(el("p", "tm-sub", tx("hz.meaning", { low, high })));
    panel.append(el("p", "tm-note", schoolText));
  }

  function drawPanel() {
    if (stationView()) { drawStationPanel(); return; }
    const code = state.selected;
    const m = M[code];
    const feat = boundaries.features.find((f) => f.properties.code === code);
    panel.replaceChildren();
    panel.append(el("h2", null, nameOf(code, feat ? feat.properties.name : code)));
    if (!m) {
      panel.append(el("p", "tm-sub", tx("panel.noTrades")));
      return;
    }
    const modeLabel = {
      trend: tx("label.trend", { start: state.start, end: state.end }),
      buy: tx("label.buyCity", { period: pts[state.pc].latestPeriod }),
      invest: tx("label.invest", { from: data.investWindow[0], to: data.investWindow[1] }),
    }[state.mode];
    drawHeadline(valueOf(code), tx("label.withPc", { label: modeLabel, pc: pcLabel(state.pc) }), tx("note.latest4"));
    if (state.pc === "hedonic") drawHedonic(m);
    else drawOffset(m);
    if (L && L.cities[code]) {
      const n = L.cities[code].schools;
      drawHazard(L.cities[code], tx("hz.whereCity"), n.elementary || n.junior
        ? tx("hz.schoolsCity", { e: n.elementary, j: n.junior })
        : tx("hz.noSchoolsCity"));
    }

    // 最新 4 季
    panel.append(el("h3", null, tx("panel.latestTitle")));
    const kv = el("table", "tm-kv");
    const tr0 = el("tr");
    ["", tx("panel.unitPrice"), tx("rank.ci"), tx("rank.n")].forEach((t) => tr0.append(el("th", null, t)));
    kv.append(tr0);
    for (const pc of Object.keys(pts)) {
      const p = m.latest[pc];
      const tr = el("tr");
      tr.append(el("td", null, `${tx(`pcRow.${pc}`)}（${pts[pc].latestPeriod}）`));
      if (!p || p.median == null) { tr.append(el("td", null, "—"), el("td", null, "—"), el("td", null, "0")); }
      else {
        tr.append(el("td", null, man(p.median)), el("td", null, p.status === "ok" ? `${man(p.low)}〜${man(p.high)}` : tx("insufficient")), el("td", null, fmtN(p.n)));
      }
      kv.append(tr);
    }
    panel.append(kv);

    panel.append(el("h3", null, tx("panel.yearlyTitle")));
    const c1 = el("div", "tm-chart");
    panel.append(c1);
    drawYearly(c1, m);
    const extra = { hedonic: tx("panel.yearlyHedonic"), combined: tx("panel.yearlyCombined") }[state.pc] || "";
    panel.append(el("p", "tm-sub", tx("panel.yearlyNote", { minN: T.minN, extra })));

    if (m.byAge.length) {
      panel.append(el("h3", null, tx("panel.byAgeTitle", { from: data.investWindow[1] - 4, to: data.investWindow[1] })));
      const c2 = el("div", "tm-chart");
      panel.append(c2);
      drawByAge(c2, m.byAge);
    }
    if (S) {
      const here = dataStations.filter((id) => SL[id].city === code && SL[id].latest.status === "ok");
      if (here.length) {
        const b = el("button", "tm-link", tx("panel.seeStations", { city: nameOf(code), n: here.length }));
        b.type = "button";
        b.addEventListener("click", () => { setView("station"); state.station = biggestIn(here); zoomOf.station = null; render(); });
        panel.append(b);
      }
    }
  }

  function stationModeLabel() {
    return {
      trend: tx("label.trend", { start: state.start, end: state.end }),
      buy: tx("label.buyStation", { period: S.latestPeriod, target: S.target }),
      invest: tx("label.invest", { from: S.investWindow[0], to: S.investWindow[1] }),
    }[state.mode];
  }

  function drawStationPanel() {
    const id = state.station;
    const s = SL[id];
    panel.replaceChildren();
    if (!s) { panel.append(el("p", "tm-sub", tx("st.pick"))); return; }
    panel.append(el("h2", null, nm(s.name)));
    panel.append(el("div", "tm-sub", s.lines.map(nm).join("・")));
    if (!s.latest) {
      panel.append(el("p", "tm-sub", tx("st.noTrades", { year: S.years[0] })));
      return;
    }
    drawHeadline(valueOfStation(id), tx("label.withPc", { label: stationModeLabel(), pc: pcLabel("hedonic") }), tx("note.latest12"));

    const x = valueOfStation(id);
    const cx = valueFrom(sameMethodCity(s.city));
    const cmp = el("div", "tm-cmp");
    const cname = nameOf(s.city, s.city);
    if (x.status !== "insufficient" && cx.status !== "insufficient") {
      if (state.mode === "buy") {
        cmp.append(el("b", null, tx("st.vsCityBuy", { city: cname, d: pct(x.v / cx.v - 1) })),
          document.createTextNode(tx("st.vsCityBuyNote", { city: cname, v: man(cx.v), n: fmtN(cx.n) })));
      } else {
        cmp.append(el("b", null, tx("st.cityValue", { city: cname, v: fmtValue(cx.v) })),
          document.createTextNode(tx("st.cityValueNote", { range: fmtRange(cx.lo, cx.hi) })));
      }
      panel.append(cmp);
    }
    const cities = Object.entries(s.cities);
    panel.append(el("p", "tm-note", cities.length > 1
      ? tx("st.cities", {
        list: cities.slice(0, 3).map(([c, n]) => tx("st.cityN", { city: nameOf(c, c), n: fmtN(n) })).join(tx("sep")),
        more: cities.length > 3 ? "…" : "", city: cname,
      })
      : tx("st.oneCity", { city: cname, year: S.years[0], n: fmtN(s.total) })));
    if (L && L.stations[id]) {
      const h = L.stations[id];
      const names = [...h.elementary, ...h.junior].map(nm);
      drawHazard(h, tx("hz.whereStation", { r: L.radius }), names.length
        ? tx("hz.schoolsStation", { list: names.join(tx("sep")) })
        : tx("hz.noSchoolsStation"));
    }
    if (s.pax) panel.append(el("p", "tm-note", tx("st.pax", { n: fmtN(s.pax), year: s.paxYear })));

    panel.append(el("h3", null, tx("st.yearlyTitle")));
    const c1 = el("div", "tm-chart");
    panel.append(c1);
    const series = [{ label: tx("st.this"), color: "var(--hed)", rows: s.yearly, points: true }];
    if (S.cityYearly[s.city]) series.push({ label: cname, color: "var(--muted)", dash: "5 4", rows: S.cityYearly[s.city] });
    drawLines(c1, series, S.years);
    panel.append(el("p", "tm-sub", tx("st.yearlyNote", { city: cname, minN: T.minN })));
    panel.append(el("p", "tm-note", tx("st.method", { standard: standard() })));
    const b = el("button", "tm-link", tx("st.seeCity", { city: cname }));
    b.type = "button";
    b.addEventListener("click", () => { setView("city"); state.selected = s.city; render(); });
    panel.append(b);
  }

  // 品質調整：典型物件的條件；趨勢模式時和中位數的漲幅比較（差的部分是賣出物件的組成變化）
  function drawHedonic(m) {
    panel.append(el("p", "tm-note", tx("hed.standard", { standard: standard() })));
    if (state.mode !== "trend") return;
    const key = `${state.start}-${state.end}`;
    const gh = (m.growth.hedonic || {})[key], gm = (m.growth["01"] || {})[key];
    if (!gh || !gm) return;
    const diff = (gm[0] - gh[0]) * 100;
    const w = el("div", Math.abs(diff) >= 10 ? "tm-warn" : "tm-note");
    w.append(el("b", null, tx("hed.cmp", { median: pct(gm[0]), hedonic: pct(gh[0]) })),
      document.createTextNode(Math.abs(diff) < 3
        ? tx("hed.same")
        : tx("hed.diff", { pp: Math.abs(diff).toFixed(0), dir: diff > 0 ? tx("hed.over") : tx("hed.under") })));
    panel.append(w);
  }

  // 取引和成約的落差：綜合指標的換算依據；落差每年不穩定時提醒使用者分開看
  function drawOffset(m) {
    const o = m.offset;
    if (!o) return;
    if (o.status !== "ok") {
      panel.append(el("p", "tm-note", tx("off.none", { minN: T.minN })));
      return;
    }
    const cheaper = tx(o.pct >= 0 ? "off.cheaper" : "off.dearer", { p: Math.abs(o.pct * 100).toFixed(0) });
    panel.append(el("p", "tm-note",
      tx("off.note", { cheaper, from: o.gaps[0][0], to: o.gaps[o.gaps.length - 1][0], lo: pct(o.low), hi: pct(o.high) })));
    if (o.unstable) {
      const w = el("div", "tm-warn");
      w.append(el("b", null, tx("off.unstable")),
        document.createTextNode(tx("off.unstableNote", { list: o.gaps.map(([y, g]) => tx("off.gap", { y, g: pct(g) })).join(tx("sep")) })));
      panel.append(w);
    }
  }

  function drawYearly(container, m) {
    const style = {
      "01": { color: "var(--accent)" }, "02": { color: "#d07a2c" },
      combined: { color: "var(--fg)", dash: "5 4" }, hedonic: { color: "var(--hed)" },
    };
    // 取引、成約一定畫；品質調整、綜合只在選到時畫（綜合沒有換算成約時和取引一樣，不畫）
    const showCombined = state.pc === "combined" && m.offset && m.offset.status === "ok";
    const series = ["01", "02", "combined", "hedonic"]
      .filter((pc) => pts[pc] && (pc === "01" || pc === "02" || (pc === "combined" ? showCombined : state.pc === "hedonic")))
      .map((pc) => ({ label: tx(`pcShort.${pc}`), ...style[pc], points: pc !== "combined", rows: m.yearly[pc] || [] }));
    drawLines(container, series);
  }

  // 每年的折線：series = [{label, color, dash, points, rows: [[年, 筆數, 中位數]]}]；points = false 不畫點（綜合的筆數有重複）
  function drawLines(container, series, xYears) {
    series = series.filter((s) => s.rows.length);
    const endText = (s) => `${s.label} ${man(s.rows[s.rows.length - 1][2])}`;
    // 右側線尾標籤的寬度（概算：全形字 11px、半形 6.5px），長的區名也不會被切掉
    const textW = (t) => [...t].reduce((a, c) => a + (c.charCodeAt(0) > 255 ? 11 : 6.5), 0);
    const w = Math.max(260, panel.clientWidth - 30), h = 170, ml = 34, mt = 8, mb = 22;
    const mr = Math.max(60, d3.max(series, (s) => textW(endText(s))) + 10 || 0);
    const all = series.flatMap((s) => s.rows);
    if (!all.length) { container.append(el("p", "tm-sub", tx("chart.noYears"))); return; }
    const years = xYears ? d3.extent(xYears) : d3.extent(all, (r) => r[0]);
    const x = d3.scaleLinear(years[0] === years[1] ? [years[0] - 1, years[1] + 1] : years, [ml, w - mr]);
    const y = d3.scaleLinear([0, d3.max(all, (r) => r[2]) * 1.1], [h - mb, mt]).nice();
    const svg = d3.select(container).append("svg").attr("viewBox", `0 0 ${w} ${h}`);
    svg.append("g").selectAll("line").data(y.ticks(4)).join("line").attr("x1", ml).attr("x2", w - mr)
      .attr("y1", (d) => y(d)).attr("y2", (d) => y(d)).style("stroke", "var(--line)");
    svg.append("g").selectAll("text").data(y.ticks(4)).join("text").attr("x", ml - 6).attr("y", (d) => y(d)).attr("dy", "0.32em")
      .attr("text-anchor", "end").text((d) => d / 10000);
    const xt = x.ticks(Math.min(6, years[1] - years[0] + 1)).filter(Number.isInteger);
    svg.append("g").selectAll("text").data(xt).join("text").attr("x", (d) => x(d)).attr("y", h - 6).attr("text-anchor", "middle").text((d) => d);
    if (state.mode === "trend") {
      for (const yr of [state.start, state.end]) svg.append("line").attr("x1", x(yr)).attr("x2", x(yr)).attr("y1", mt).attr("y2", h - mb)
        .style("stroke", "var(--muted)").attr("stroke-dasharray", "3 3");
    }
    const line = d3.line().x((r) => x(r[0])).y((r) => y(r[2]));
    for (const s of series) {
      svg.append("path").datum(s.rows).attr("d", line).style("fill", "none").style("stroke", s.color).attr("stroke-width", s.dash ? 1.6 : 2)
        .attr("stroke-dasharray", s.dash || null).attr("stroke-linejoin", "round").attr("stroke-linecap", "round");
      if (!s.points) continue;
      svg.append("g").selectAll("circle").data(s.rows).join("circle").attr("cx", (r) => x(r[0])).attr("cy", (r) => y(r[2])).attr("r", 2.6)
        .style("fill", (r) => (r[1] >= T.minN ? s.color : "var(--panel)")).style("stroke", s.color).attr("stroke-width", 1.2)
        .append("title").text((r) => tx("chart.point", { year: r[0], label: s.label, v: man(r[2]), n: fmtN(r[1]) }));
    }
    // 線尾標籤放在右側；兩條線的終點太近時上下錯開，避免重疊
    const ends = series.map((s) => {
      const last = s.rows[s.rows.length - 1];
      return { s, y: y(last[2]), text: endText(s) };
    }).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
    for (const e of ends) svg.append("text").attr("x", w - mr + 6).attr("y", e.y).attr("dy", "0.32em")
      .style("fill", e.s.color).style("font-weight", 500).text(e.text);
  }

  function drawByAge(container, rows) {
    const w = Math.max(260, panel.clientWidth - 30), bh = 16, gap = 6, ml = 58, mr = 90;
    const h = rows.length * (bh + gap);
    const x = d3.scaleLinear([0, d3.max(rows, (r) => r[2])], [ml, w - mr]);
    const svg = d3.select(container).append("svg").attr("viewBox", `0 0 ${w} ${h}`);
    const g = svg.selectAll("g").data(rows).join("g").attr("transform", (r, i) => `translate(0,${i * (bh + gap)})`);
    g.append("text").attr("x", ml - 6).attr("y", bh / 2).attr("dy", "0.32em").attr("text-anchor", "end").text((r) => tx("chart.decade", { d: r[0] }));
    g.append("rect").attr("x", ml).attr("height", bh).attr("rx", 2).attr("width", (r) => Math.max(1, x(r[2]) - ml))
      .style("fill", (r) => (r[1] >= T.minN ? "var(--accent)" : "var(--na)"));
    g.append("text").attr("x", (r) => x(r[2]) + 6).attr("y", bh / 2).attr("dy", "0.32em").text((r) => tx("chart.bar", { v: man(r[2]), n: fmtN(r[1]) }));
  }

  // ---- 路線圖：依路線上的順序，各站的值與 95% 區間 ----
  function drawLineChart(color) {
    const card = document.getElementById("line-card");
    card.hidden = state.view !== "line";
    if (card.hidden) return;
    const ln = lineByKey[state.line];
    document.getElementById("line-title").textContent = tx("lineCard.heading", { line: nm(ln.label), label: stationModeLabel() });
    const box = document.getElementById("line-chart");
    box.replaceChildren();
    const nodes = ln.ids.map((id) => ({ id, s: SL[id], x: valueOfStation(id) }));
    const ok = nodes.filter((d) => d.x.status !== "insufficient");
    const step = 24, ml = 46, mr = 12, mt = 26, mb = 92, ph = 190;
    const w = Math.max(box.clientWidth || 600, ml + mr + step * nodes.length);
    const h = mt + ph + mb;
    const x = d3.scalePoint(nodes.map((d) => d.id), [ml, w - mr]).padding(0.5);
    const lo = d3.min(ok, (d) => d.x.lo), hi = d3.max(ok, (d) => d.x.hi);
    const y = (state.mode === "buy" ? d3.scaleLinear([0, (hi || 1) * 1.05], [mt + ph, mt]) : d3.scaleLinear([Math.min(0, lo || 0), Math.max(0, hi || 0.01)], [mt + ph, mt])).nice();
    const svg = d3.select(box).append("svg").attr("width", w).attr("height", h).attr("viewBox", `0 0 ${w} ${h}`)
      .attr("role", "img").attr("aria-label", tx("lineCard.aria", { line: nm(ln.label) }));
    // 所在區的色帶：連續幾站在同一區就畫成一段，上面寫區名
    const bands = [];
    for (const d of nodes) {
      const c = d.s.city || (bands.length ? bands[bands.length - 1].city : null);
      if (bands.length && bands[bands.length - 1].city === c) bands[bands.length - 1].ids.push(d.id);
      else bands.push({ city: c, ids: [d.id] });
    }
    const half = x.step() / 2;
    bands.forEach((b, i) => {
      const x0 = x(b.ids[0]) - half, x1 = x(b.ids[b.ids.length - 1]) + half;
      if (i % 2 === 0) svg.append("rect").attr("x", x0).attr("y", mt - 18).attr("width", x1 - x0).attr("height", ph + 18).style("fill", "var(--bg)");
      if (b.city && x1 - x0 > 30) svg.append("text").attr("x", (x0 + x1) / 2).attr("y", mt - 6).attr("text-anchor", "middle")
        .text(nameOf(b.city, "")).style("font-size", "10px");
    });
    svg.append("g").selectAll("line").data(y.ticks(4)).join("line").attr("x1", ml).attr("x2", w - mr)
      .attr("y1", (v) => y(v)).attr("y2", (v) => y(v)).style("stroke", "var(--line)").style("stroke-dasharray", (v) => (v === 0 && state.mode !== "buy" ? null : "2 3"));
    svg.append("g").selectAll("text").data(y.ticks(4)).join("text").attr("x", ml - 6).attr("y", (v) => y(v)).attr("dy", "0.32em")
      .attr("text-anchor", "end").text((v) => (state.mode === "buy" ? v / 10000 : pct(v).replace(".0%", "%")));
    const pt = svg.append("g").selectAll("g").data(ok).join("g").attr("class", "pt").on("click", (ev, d) => selectStation(d.id));
    pt.append("line").attr("x1", (d) => x(d.id)).attr("x2", (d) => x(d.id)).attr("y1", (d) => y(d.x.lo)).attr("y2", (d) => y(d.x.hi))
      .style("stroke", "var(--muted)").attr("stroke-width", 1.4);
    pt.append("circle").attr("cx", (d) => x(d.id)).attr("cy", (d) => y(d.x.v)).attr("r", (d) => (d.id === state.station ? 6 : 4.5))
      .style("fill", (d) => (d.x.status === "uncertain" ? "var(--panel)" : color(d.x.v))).style("stroke", (d) => (d.id === state.station ? "var(--fg)" : color(d.x.v)))
      .attr("stroke-width", (d) => (d.id === state.station ? 2 : 1.4));
    pt.append("title").text((d) => tx("lineCard.point", { name: nm(d.s.name), v: fmtValue(d.x.v), range: fmtRange(d.x.lo, d.x.hi), n: d.x.n }));
    svg.append("g").selectAll("text").data(nodes).join("text")
      .attr("class", (d) => "name" + (d.x.status === "insufficient" ? " dim" : "") + (d.id === state.station ? " sel" : ""))
      .attr("transform", (d) => `translate(${x(d.id) + 4},${mt + ph + 10}) rotate(-60)`).attr("text-anchor", "end").text((d) => nm(d.s.name))
      .on("click", (ev, d) => { if (d.s.latest) selectStation(d.id); });
    document.getElementById("line-note").textContent = tx("lineCard.note", { minN: T.minN });
  }

  // ---- 排行 ----
  function drawRank(color) {
    const body = document.getElementById("rank-body");
    body.replaceChildren();
    const label = stationView() ? pcLabel("hedonic") : pcLabel(state.pc);
    const where = state.view === "line" ? tx("rank.whereLine", { line: lineLabel() }) : stationView() ? tx("rank.whereStation") : "";
    const suffix = state.view === "line" ? "" : tx("rank.suffix");
    document.getElementById("rank-title").textContent = {
      trend: tx("rank.trend", { where, start: state.start, end: state.end, suffix, label }),
      buy: tx("rank.buy", { where, period: stationView() ? tx("rank.latest12") : tx("rank.latest4"), suffix, label }),
      invest: tx("rank.invest", { where, years: (stationView() ? S.investWindow : data.investWindow).join("〜"), suffix, label }),
    }[state.mode];
    document.getElementById("rank-name").textContent = stationView() ? tx("rank.station") : tx("rank.city");
    document.getElementById("rank-col").textContent = tx(`rank.col.${state.mode}`);
    const rows = items();
    const ordered = state.view === "line" ? rows : [
      ...rows.filter((r) => r.status !== "insufficient").sort((a, b) => b.v - a.v),
      ...rows.filter((r) => r.status === "insufficient").sort((a, b) => a.key.localeCompare(b.key)),
    ];
    const selectedKey = stationView() ? state.station : state.selected;
    ordered.forEach((r, i) => {
      const tr = el("tr");
      if (r.key === selectedKey) tr.classList.add("selected");
      if (r.status !== "ok") tr.classList.add("dim");
      tr.append(el("td", null, state.view === "line" ? String(i + 1) : r.status === "insufficient" ? "" : String(i + 1)));
      const td = el("td");
      const dot = el("span", "tm-dot");
      dot.style.background = r.status === "insufficient" ? "var(--na)" : color(r.v);
      if (stationView()) dot.style.borderRadius = "50%";
      const s = SL[r.key];
      const btn = el("button", null, stationView() ? nm(s.name) : nameOf(r.key, r.key));
      btn.type = "button";
      btn.addEventListener("click", () => (stationView() ? (s.latest && selectStation(r.key, true)) : select(r.key, true)));
      td.append(dot, btn);
      if (stationView() && s.city) td.append(el("small", null, nameOf(s.city, "")));
      tr.append(td);
      if (r.status === "insufficient") tr.append(el("td", null, stationView() && !s.latest ? tx("rank.noTrades") : tx("insufficient")), el("td", null, ""), el("td", null, String(r.n)));
      else tr.append(
        el("td", null, fmtValue(r.v) + (r.status === "uncertain" ? "？" : "")),
        el("td", null, fmtRange(r.lo, r.hi)),
        el("td", null, typeof r.n === "number" ? fmtN(r.n) : r.n),
      );
      body.append(tr);
    });
  }

  // ---- 控制項 ----
  const yearsNow = () => (stationView() ? S.years : pts[state.pc].completeYears);
  function fillYears() {
    const ys = yearsNow();
    if (!ys.includes(state.start) || !ys.includes(state.end) || state.start >= state.end) {
      state.end = ys[ys.length - 1];
      state.start = ys[Math.max(0, ys.length - 11)];
    }
    for (const [id, key] of [["year-start", "start"], ["year-end", "end"]]) {
      const s = document.getElementById(id);
      s.replaceChildren(...ys.map((y) => new Option(String(y), String(y))));
      s.value = String(state[key]);
    }
    document.getElementById("year-start").querySelectorAll("option").forEach((o) => { o.disabled = +o.value >= state.end; });
    document.getElementById("year-end").querySelectorAll("option").forEach((o) => { o.disabled = +o.value <= state.start; });
  }

  let linesLang = null; // 路線選單用哪個語言填的（換語言時重填）
  function fillLines() {
    const sel = document.getElementById("line-select");
    if (linesLang === lang) { sel.value = state.line; return; }
    sel.replaceChildren();
    linesLang = lang;
    // 只有一條路線的公司併成「其他」，選單才不會太長
    const groups = d3.groups(S.lines, (l) => l.group);
    const other = groups.filter(([, ls]) => ls.length === 1).flatMap(([, ls]) => ls);
    for (const [name, ls] of [...groups.filter(([, ls]) => ls.length > 1).map(([n, ls]) => [nm(n), ls]), ...(other.length ? [[tx("line.other"), other]] : [])]) {
      const og = document.createElement("optgroup");
      og.label = name;
      for (const l of ls) og.append(new Option(nm(l.label), l.key));
      sel.append(og);
    }
    sel.value = state.line;
  }

  function layerExplain() {
    if (!state.layer) return "";
    if (isDepth()) return tx("explain.layerDepth", { layer: layerLabel(state.layer), city: stationView() ? "" : tx("explain.layerDepthCity") });
    return tx("explain.layerSchool", { layer: layerLabel(state.layer) });
  }

  function syncControls() {
    if (state.mode === "invest" && !data.investPriceTypes.includes(state.pc)) state.pc = data.investPriceTypes[0];
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
    document.querySelectorAll("[data-pc]").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.pc === state.pc));
      const hasData = !!pts[b.dataset.pc] && (state.mode !== "trend" || pts[b.dataset.pc].completeYears.length >= 2);
      b.disabled = !hasData || (state.mode === "invest" && !data.investPriceTypes.includes(b.dataset.pc));
      b.hidden = !pts[b.dataset.pc];
    });
    document.getElementById("pc-field").hidden = stationView();
    document.getElementById("line-field").hidden = state.view !== "line";
    document.getElementById("zoom").hidden = !stationView() && !state.layer;
    document.getElementById("layer-field").hidden = !L;
    document.getElementById("layer-select").value = state.layer;
    if (state.view === "line") fillLines();
    document.getElementById("years-field").hidden = state.mode !== "trend";
    if (state.mode === "trend") fillYears();
    const e = document.getElementById("tm-explain");
    if (stationView()) {
      e.textContent = {
        trend: tx("explain.st.trend", { start: state.start, end: state.end }),
        buy: tx("explain.st.buy", { period: S.latestPeriod, target: S.target }),
        invest: tx("explain.st.invest", { from: S.investWindow[0], to: S.investWindow[1] }),
      }[state.mode] + tx("explain.st.method", { click: state.view === "line" ? tx("explain.st.clickLine") : tx("explain.st.click") }) + layerExplain();
      return;
    }
    e.textContent = {
      trend: tx("explain.city.trend", { start: state.start, end: state.end }),
      buy: tx("explain.city.buy", { period: pts[state.pc].latestPeriod }),
      invest: tx("explain.city.invest", { from: data.investWindow[0], to: data.investWindow[1] }),
    }[state.mode] + ({ hedonic: tx("explain.city.hedonic"), combined: tx("explain.city.combined") }[state.pc] || "") + layerExplain();
  }

  function redraw() {
    drawMap();
    drawPanel();
    const color = colorScale();
    drawLineChart(color);
    drawRank(color);
  }

  function render() {
    syncControls();
    redraw();
  }

  function select(code, scroll) {
    state.selected = code;
    if (E) setEstCity(code);
    redraw();
    if (scroll && window.matchMedia("(max-width: 860px)").matches) panel.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function selectStation(id, scroll) {
    state.station = id;
    redraw();
    if (scroll && window.matchMedia("(max-width: 860px)").matches) panel.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function setLine(key) {
    state.line = key;
    zoomOf.line = null;
    const ids = lineByKey[key].ids;
    if (!ids.includes(state.station)) state.station = biggestIn(ids);
    render();
  }

  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => { setView(b.dataset.view); render(); }));
  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { state.mode = b.dataset.mode; render(); }));
  document.querySelectorAll("[data-pc]").forEach((b) => b.addEventListener("click", () => { if (!b.disabled) { state.pc = b.dataset.pc; render(); } }));
  document.getElementById("year-start").addEventListener("change", (e) => { state.start = +e.target.value; render(); });
  document.getElementById("year-end").addEventListener("change", (e) => { state.end = +e.target.value; render(); });
  document.getElementById("line-select").addEventListener("change", (e) => setLine(e.target.value));
  document.getElementById("layer-select").addEventListener("change", (e) => { state.layer = e.target.value; render(); });
  for (const k of ["in", "out", "ku", "all"]) document.getElementById(`zoom-${k}`).addEventListener("click", () => zoomApi && zoomApi[k]());

  // ---- 估價（公式和 analysis/estimate.py 的 CoefTable.log_price 相同；測試用 Python 照這個公式算一遍） ----
  function estimateLog(city, district, area, built, plan, plusS, structure, renovated, seiyaku) {
    const c = E.cities[city];
    const age = Math.max(0, E.year - built);
    const la = Math.log(area);
    let out = c.now + c.districts[district];
    out += E.area[0] * la + d3.sum(E.area[1], ([knot, coef]) => coef * Math.max(0, la - knot));
    out += E.age[0] * age + d3.sum(E.age[1], ([knot, coef]) => coef * Math.max(0, age - knot));
    out += E.areaNow * Math.log(area / E.standardArea);
    out += E.oldSeismic * (built <= E.oldSeismicLastYear ? 1 : 0);
    out += E.plans[plan] + E.plusS * (plusS ? 1 : 0) + E.structures[structure] + E.renovated * (renovated ? 1 : 0);
    return out + (seiyaku ? c.seiyaku : 0);
  }
  // 區間的分組：屋齡帶 × 2 + 多摩（estimate.interval_group）
  const estGroup = (city, built) => {
    const age = Math.max(0, E.year - built);
    return E.ageBands.filter((b) => age >= b).length * 2 + (city > E.kuMax ? 1 : 0);
  };
  // 分組的名稱（estimate.group_label）
  const estGroupLabel = (g) => {
    const band = Math.floor(g / 2), bounds = [0, ...E.ageBands];
    const age = band < E.ageBands.length
      ? tx("est.ageRange", { lo: bounds[band], hi: E.ageBands[band] })
      : tx("est.ageOver", { lo: E.ageBands[E.ageBands.length - 1] });
    return tx("est.groupLabel", { region: tx(g % 2 ? "region.tama" : "region.ku"), age });
  };
  const estEl = (id) => document.getElementById(id);
  function fillEstDistricts() {
    const city = estEl("est-city").value;
    const ds = Object.keys(E.cities[city].districts).sort((a, b) => a.localeCompare(b, "ja"));
    const keep = estEl("est-district").value;
    estEl("est-district").replaceChildren(...ds.map((d) => new Option(nm(d), d)));
    estEl("est-district").value = ds.includes(keep) ? keep : E.cities[city].top; // 預設：成交最多的町名
  }
  function fillEstCities() {
    const codes = Object.keys(E.cities).sort();
    const keep = estEl("est-city").value;
    estEl("est-city").replaceChildren(...codes.map((c) => new Option(nameOf(c, c), c)));
    estEl("est-city").value = keep || (E.cities[state.selected] ? state.selected : codes[0]);
  }
  function setEstCity(code) {
    if (!E || !E.cities[code] || estEl("est-city").value === code) return;
    estEl("est-city").value = code;
    estEl("est-district").replaceChildren();
    fillEstDistricts();
    drawEstimate();
  }
  function drawEstimate() {
    const out = estEl("est-result"), note = estEl("est-note");
    out.replaceChildren();
    const city = estEl("est-city").value, district = estEl("est-district").value;
    const area = +estEl("est-area").value, built = +estEl("est-built").value;
    if (!(area >= 10 && area <= 300) || !(built >= 1950 && built <= E.year + 1) || !Number.isInteger(built)) {
      out.append(el("p", "tm-sub", tx("est.invalid", { maxYear: E.year + 1 })));
      note.textContent = "";
      return;
    }
    const g = estGroup(city, built);
    const t = el("table", "tm-kv");
    const tr0 = el("tr");
    ["", ...E.levels.map((lv) => tx("est.levelHead", { p: Math.round(lv * 100) }))].forEach((x) => tr0.append(el("th", null, x)));
    t.append(tr0);
    for (const pc of ["01", "02"]) {
      if (pc === "02" && E.cities[city].seiyaku == null) continue;
      const mu = estimateLog(city, district, area, built, estEl("est-plan").value, estEl("est-plus-s").checked,
        estEl("est-structure").value, estEl("est-renovated").checked, pc === "02");
      const tr = el("tr");
      tr.append(el("td", null, tx(`est.level.${pc}`)));
      E.quantiles[g].forEach(([lo, hi]) => {
        const td = el("td");
        const ul = Math.exp(mu + lo), uh = Math.exp(mu + hi);
        td.append(el("b", null, tx("est.unit", { lo: fmtN(Math.round(ul / 1e4)), hi: fmtN(Math.round(uh / 1e4)) })),
          el("small", null, tx("est.total", { lo: fmtN(Math.round(ul * area / 1e5) * 10), hi: fmtN(Math.round(uh * area / 1e5) * 10) })));
        tr.append(td);
      });
      t.append(tr);
    }
    out.append(t);
    const cov = E.coverage["全部"];
    note.textContent = tx("est.note", { group: estGroupLabel(g), c50: Math.round(cov[0] * 100), c80: Math.round(cov[1] * 100), period: E.period }) +
      (E.cities[city].seiyaku == null ? tx("est.tradeOnly", { city: nameOf(city, city) }) : "") + tx("est.cli");
  }
  if (E) {
    estEl("est-card").hidden = false;
    fillEstCities();
    fillEstDistricts();
    estEl("est-built").value = String(E.year - 17);
    estEl("est-built").max = String(E.year + 1);
    estEl("est-plan").replaceChildren(...Object.keys(E.plans).map((p) => new Option(p, p)));
    estEl("est-plan").value = "2LDK";
    estEl("est-structure").replaceChildren(...Object.keys(E.structures).map((x) => new Option(x, x)));
    estEl("est-city").addEventListener("change", () => { estEl("est-district").replaceChildren(); fillEstDistricts(); drawEstimate(); });
    for (const id of ["est-district", "est-plan", "est-structure", "est-plus-s", "est-renovated"]) estEl(id).addEventListener("change", drawEstimate);
    for (const id of ["est-area", "est-built"]) estEl(id).addEventListener("input", drawEstimate);
  }

  // ---- 固定文字（換語言時重填） ----
  function fillStatic() {
    document.documentElement.lang = lang === "ja" ? "ja" : "zh-Hant";
    document.title = tx("title");
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    document.querySelectorAll("[data-i18n]").forEach((e) => { e.textContent = tx(e.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach((e) => { e.innerHTML = tx(e.dataset.i18nHtml); }); // 自己的翻譯檔（有 <strong>）
    document.querySelectorAll("[data-i18n-aria]").forEach((e) => e.setAttribute("aria-label", tx(e.dataset.i18nAria)));
    const totalLatest = d3.sum(Object.values(M), (m) => (m.latest["01"] ? m.latest["01"].n : 0));
    document.getElementById("tm-source").textContent =
      tx("source", { from: years01[0], to: years01[years01.length - 1], from02: pts["02"] ? pts["02"].completeYears[0] : "—", cities: Object.keys(M).length }) +
      (S ? tx("source.stations", { n: fmtN(dataStations.length) }) : "") + tx("source.tail", { n: fmtN(totalLatest), date: data.generated });
    document.getElementById("note-thresholds").textContent = tx("notes.thresholds", {
      minN: T.minN, years: T.investWindowYears, minYears: T.investMinYears, width: (T.investMaxCiWidth * 100).toFixed(0),
    });
    document.getElementById("note-advice").textContent = tx("notAdvice");
    const noteHed = document.getElementById("note-hedonic");
    if (data.hedonic) {
      const H = data.hedonic;
      noteHed.textContent = tx("notes.hedonic", { n: fmtN(H.n), r2: H.r2, outliers: fmtN(H.outliers), standard: standard() });
    } else {
      noteHed.parentElement.hidden = true;
    }
    if (S) {
      document.getElementById("note-station").textContent = tx("notes.station", {
        year: S.years[0], n: fmtN(S.n), standard: standard(), target: S.target, minN: T.minN,
      });
    } else {
      document.getElementById("note-station-wrap").hidden = true;
      document.getElementById("view-field").hidden = true;
    }
    if (L) {
      document.getElementById("note-layers-wrap").hidden = false;
      document.getElementById("note-layers").textContent = tx("notes.layers", { r: L.radius });
    }
    if (E) {
      estEl("note-estimate-wrap").hidden = false;
      estEl("note-estimate").textContent = tx("notes.estimate", {
        period: E.period, c80: Math.round(E.coverage["全部"][1] * 100), n: fmtN(E.coverageN["全部"]),
      });
      fillEstCities();
      fillEstDistricts();
      drawEstimate();
    }
    // 免責聲明、出處：三種語言都用日文原文
    document.getElementById("note-disclaimer").textContent = data.text.disclaimer;
    document.getElementById("note-credit").textContent = tx("credit.boundary", { credit: data.text.boundaryCredit }) +
      (S ? tx("credit.station", { credit: data.text.stationCredit }) : "") +
      (L ? tx("credit.layers", { credits: Object.values(L.credits).join("、") }) : "");
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* 存不了就只換這一次 */ }
    fillStatic();
    render();
  }
  document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { if (b.dataset.lang !== lang) setLang(b.dataset.lang); }));

  fillStatic();
  render();
  let lastW = mapEl.clientWidth;
  new ResizeObserver(() => {
    if (Math.abs(mapEl.clientWidth - lastW) > 4) {
      lastW = mapEl.clientWidth;
      for (const k of Object.keys(zoomOf)) zoomOf[k] = null; // 縮放是以像素記的，寬度變了就回到預設範圍
      redraw();
    }
  }).observe(mapEl);
})();
</script>
